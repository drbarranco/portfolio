  <style>
    /* Estilos específicos para la página de detalles CRT */
    .details-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      padding: 15px;
      background-color: var(--bg-deep);
      overflow-y: auto;
    }
    .details-workspace {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 15px;
      flex-grow: 1;
      margin-bottom: 10px;
    }
    @media (max-width: 991px) {
      .details-workspace {
        grid-template-columns: 1fr;
        height: auto;
        overflow-y: visible;
      }
      .details-container {
        height: auto;
        overflow-y: visible;
      }
    }
    
    /* HUD Header */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border: 1.5px solid rgba(255, 176, 0, 0.25);
      border-radius: 8px;
      background: rgba(13, 10, 8, 0.85);
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .hud-title {
      font-family: var(--font-terminal);
      color: var(--crt-glow);
      font-weight: 700;
      font-size: 1.1rem;
      text-shadow: 0 0 8px var(--crt-glow-dim);
      letter-spacing: 1px;
    }
    
    /* HUD Footer */
    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      border: 1.5px solid rgba(255, 176, 0, 0.25);
      border-radius: 8px;
      background: rgba(13, 10, 8, 0.85);
      margin-top: 10px;
      font-family: var(--font-terminal);
      font-size: 0.75rem;
      color: rgba(255, 176, 0, 0.6);
      text-shadow: 0 0 4px var(--crt-glow-dim);
    }
    
    /* HUD Sidebar & Cards */
    .hud-sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .hud-card {
      background: rgba(13, 10, 8, 0.9);
      border: 1.5px solid rgba(255, 176, 0, 0.3);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .hud-card-header {
      background: rgba(255, 176, 0, 0.08);
      border-bottom: 1.5px solid rgba(255, 176, 0, 0.3);
      padding: 10px 15px;
      font-family: var(--font-terminal);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--crt-glow);
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 0 5px var(--crt-glow-dim);
      text-transform: uppercase;
    }
    .hud-card-body {
      padding: 15px;
      color: #fff;
    }
    .info-list li {
      font-family: var(--font-terminal);
      font-size: 0.85rem;
      line-height: 1.5;
      color: #f3f4f6;
    }
    .info-list li strong {
      color: var(--crt-glow);
      text-shadow: 0 0 3px var(--crt-glow-dim);
    }
    
    /* HUD Terminal Container & Body */
    .hud-terminal-container {
      background: rgba(5, 5, 8, 0.95);
      border: 2px solid rgba(0, 229, 255, 0.35);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 0, 0, 0.95);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .terminal-body {
      padding: 20px;
      font-family: var(--font-terminal);
      overflow-y: auto;
    }
    .term-log {
      margin-bottom: 15px;
      color: #e5e7eb;
      font-family: var(--font-terminal);
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .term-log.header {
      font-weight: 700;
      color: var(--crt-blue);
      border-bottom: 1px dashed rgba(0, 229, 255, 0.25);
      padding-bottom: 6px;
      margin-top: 25px;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-size: 0.95rem;
      text-shadow: 0 0 6px var(--crt-blue-glow);
    }
    .term-log.header:first-of-type {
      margin-top: 0;
      color: var(--crt-green);
      text-shadow: 0 0 6px var(--crt-green-glow);
      border-bottom: 1px solid rgba(57, 255, 20, 0.3);
    }

    .btn-crt-nav {
      background: transparent;
      border: 1px dashed var(--crt-glow);
      color: var(--crt-glow);
      padding: 6px 15px;
      font-family: var(--font-terminal);
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition-fast);
    }
    .btn-crt-nav:hover {
      background: var(--crt-glow);
      color: var(--bg-deep);
      box-shadow: 0 0 10px var(--crt-glow);
    }
    .screenshot-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    .gallery-img {
      border: 1.5px solid rgba(255, 176, 0, 0.25);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition-fast);
      aspect-ratio: 16/10;
      display: block;
    }
    .gallery-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: none;
      transition: opacity 0.2s ease;
    }
    .gallery-img:hover {
      border-color: var(--crt-glow);
      box-shadow: 0 0 8px rgba(255, 176, 0, 0.3);
      transform: scale(1.03);
    }
    .gallery-img:hover img {
      opacity: 0.85;
    }

<body class="crt-body">
  <!-- CRT Screen overlay -->
  <div class="crt-screen"></div>

  <div class="details-container">

      <a href="index.html" class="btn-crt-nav">[ <- BACK_TO_SHELL ]</a>

    <!-- Workspace -->
    <div class="details-workspace">

        <!-- Ficha -->
        <div class="hud-card">
          <div class="hud-card-header">
            <span class="card-icon">📋</span>
            <span>SYSTEM METADATA</span>
          </div>
          <div class="hud-card-body">
            <ul class="info-list" style="list-style: none; display: flex; flex-direction: column; gap: 8px;" id="project-meta-list">
              <!-- Cargado dinámicamente -->
            </ul>
          </div>
        </div>

        <!-- Capturas de pantalla -->

            <span>SCREENSHOT_BUFFERS</span>
          </div>

              <!-- Cargado dinámicamente -->
            </div>
          </div>
        </div>

      </aside>

      <section class="hud-terminal-container">

          <!-- Cargado dinámicamente -->
        </div>
      </section>

    </div>

    <!-- HUD Footer -->
    <footer class="hud-footer">
      <div class="footer-block">DECRYPT_ENGINE: ACTIVE</div>
      <div class="footer-block">DR-AUDIT_SHELL v2.0</div>
    </footer>

  <!-- Vendor JS Files -->

  <!-- Main Scripts -->
  <script src="assets/js/translations.js"></script>
  <script src="assets/js/projects.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get("id");
      const project = projects[projectId];
      
      if (!project) {
        window.location.href = "index.html";
        return;
      }

      const lang = localStorage.getItem("lang") || "es";
      const isES = lang === "es";

      // 1. Cargar Ficha Técnica
      const metaList = document.getElementById("project-meta-list");
      const cat = isES ? project.category : project.categoryEn;
      const client = isES ? project.client : project.clientEn;
      
      let metaHTML = `
        <li><strong>[NODE]:</strong> ${project.title}</li>
        <li><strong>[LAYER]:</strong> ${cat}</li>
        <li><strong>[CLIENT]:</strong> ${client}</li>
        <li><strong>[DATES]:</strong> ${project.startDate} - ${project.endDate}</li>
      `;
      if (project.url) {
        metaHTML += `<li><strong>[ONLINE_URL]:</strong> <a href="${project.url}" target="_blank" style="color: var(--crt-glow);">${project.url}</a></li>`;
      }
      if (project.repo) {
        metaHTML += `<li><strong>[SOURCE_CODE]:</strong> <a href="${project.repo}" target="_blank" style="color: var(--crt-glow);">${project.repo}</a></li>`;
      }
      metaList.innerHTML = metaHTML;

      // 2. Cargar Capturas de Pantalla en el buffer
      const gallery = document.getElementById("project-screenshot-gallery");
      gallery.innerHTML = project.images.map(src => `
        <a href="${src}" class="gallery-img glightbox">
          <img src="${src}" alt="Screenshot">
        </a>
      `).join('');

      // Inicializar GLightbox para ampliar imágenes con filtros sepia/CRT
      const lightbox = GLightbox({
        selector: '.glightbox'
      });

      // 3. Inyectar Documentación Técnica en la consola
      const docsBody = document.getElementById("project-docs-body");
      const probTitle = isES ? "01_DEFINICIÓN_DEL_PROBLEMA" : "01_PROBLEM_STATEMENT";
      const probText = isES ? project.problem : project.problemEn;
      
      const archTitle = isES ? "02_ARQUITECTURA_DE_SISTEMAS" : "02_SYSTEMS_ARCHITECTURE";
      const archText = isES ? project.architecture : project.architectureEn;

      const dbTitle = isES ? "03_MODELADO_DE_BASE_DE_DATOS" : "03_DATABASE_SCHEMA";
      const dbText = isES ? project.database : project.databaseEn;

      const apiTitle = isES ? "04_INTEGRACIÓN_API_REST" : "04_REST_API_SPEC";
      const apiText = isES ? project.api : project.apiEn;

      const chalTitle = isES ? "05_RETOS_TÉCNICOS_RESUELTOS" : "05_RESOLVED_CHALLENGES";
      const chalText = isES ? project.challenges : project.challengesEn;

      docsBody.innerHTML = `
        <div class="term-log header">>>> LOAD_DOCUMENTATION_DUMP: ${project.title.toUpperCase()}</div>
        
        <div class="term-log header" style="color: var(--crt-glow);">${probTitle}</div>
        <div class="term-log">${probText}</div>

        <div class="term-log header" style="color: var(--crt-glow);">${archTitle}</div>
        <div class="term-log">${archText}</div>

        <div class="term-log header" style="color: var(--crt-glow);">${dbTitle}</div>
        <div class="term-log" style="white-space: pre-wrap;">${dbText}</div>

        <div class="term-log header" style="color: var(--crt-glow);">${apiTitle}</div>
        <div class="term-log" style="white-space: pre-wrap;">${apiText}</div>

        <div class="term-log header" style="color: var(--crt-glow);">${chalTitle}</div>
        <div class="term-log" style="white-space: pre-wrap;">${chalText}</div>
      `;
    });
  </script>
  <script async defer src="https://scripts.simpleanalyticscdn.com/latest.js" data-collect="all" data-ignore-dnt="true"></script>
